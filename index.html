 async function restore(generation=connectionEpoch){if(!view?.started||serverBusy)return;restoring=true;sync();await makeFrame();if(generation!==connectionEpoch)return;client.hydrate(view);client.turn(view.attacker);restoring=false;opening=false;lobbyVisible(false);reconnect.hidden=true;sync();updateClock();if(view.pending&&!view.result){client.signal(view.pending.seat,view.pending.type)}if(view.result)client.sync(state,false)}
 function send(type,extra={}){if(!connected||ws?.readyState!==1){notify('Восстанавливаем соединение');return false}if(type!=='emoji'&&type!=='ready'&&(serverBusy||localBusy||restoring))return false;const id=crypto.randomUUID();ws.send(JSON.stringify({type,id,...extra}));if(['play','signal'].includes(type)){localBusy=true;sync();clearTimeout(requestTimer);requestTimer=setTimeout(()=>{if(localBusy)resnapshot()},6000)}return true}
 function reason(seat,card,target){if(!state?.started||state.result)return'Партия завершена';if(seat!==room.seat||!state.hands[seat].includes(card))return'Этой карты нет в руке';if(!connected||serverBusy||localBusy||restoring)return'Дождитесь окончания движения';if(state.pending?.confirmedBy!==undefined||state.pending&&state.pending.type!=='take')return'Подтвердите действие';const rank=c=>c.split('-')[1],suit=c=>c.split('-')[2],r=c=>['6','7','8','9','10','J','Q','K','A'].indexOf(rank(c));if(seat===state.attacker){if(state.table.length>=state.limit)return'Лимит атаки';if(state.table.length&&!state.table.some(p=>[p.card,p.cover].filter(Boolean).some(c=>rank(c)===rank(card))))return'Нужно такое же достоинство';return null}if(state.pending)return'Вы уже забираете';const p=state.table.find(p=>p.id===target);if(!p||p.cover)return'Выберите неотбитую карту';return(suit(card)===suit(p.card)?r(card)>r(p.card):suit(card)===state.trump&&suit(p.card)!==state.trump)?null:'Эта карта не отбивает'}
 function canSignal(seat,type){if(!state?.started||state.result||seat!==room.seat||!connected||serverBusy||localBusy||restoring)return false;if(state.pending)return type==='ok'&&seat!==state.pending.seat&&state.pending.confirmedBy===undefined;return type==='take'?seat!==state.attacker&&state.table.length>0:type==='bita'?seat===state.attacker&&state.table.length>0&&state.table.every(p=>p.cover):false}
 window.dualGame={ready(seat,c,win){if(win&&win!==frame?.contentWindow)return;client=c;if(state)sync();window.__redoFrameReady?.();window.__redoFrameReady=null},reason,canSignal,play:(seat,card,target)=>!reason(seat,card,target)&&send('play',{card,target}),signal:(seat,signal)=>canSignal(seat,signal)&&send('signal',{signal}),start:()=>{fullscreen();lobbyVisible(true);return send('ready')},sendEmoji(seat,symbol){if(seat!==room?.seat||clock()<emojiNext||!emojiSymbols.includes(symbol))return false;const ok=send('emoji',{symbol});if(ok){emojiNext=clock()+3000;client.emoteState(true,emojiNext)}return ok},emojis:emojiSymbols.map(symbol=>({symbol,name:symbol})),event(){},get state(){return state},get busy(){return serverBusy||localBusy}};
 async function handle(m,generation=connectionEpoch){if(generation!==connectionEpoch)return;if(m.type==='pong'){const sample=m.serverNow+(Date.now()-m.echo)/2-Date.now();offset+=Math.max(-25,Math.min(25,sample-offset))*.2;clientClock();return}if(m.type==='error'){localBusy=false;clearTimeout(requestTimer);notify(m.error);sync();return}if(m.type==='expired'){renderLobby(true);return}
  if(m.type==='emoji'){emojiNext=m.nextAt[room.seat];client?.emote(m.reaction);client?.emoteState(true,emojiNext);return}
  if(!m.view)return;const oldGame=gameId;apply(m);gameId=m.gameId;if(['begin','play','signal','take'].includes(m.type)){clearTimeout(requestTimer);requestTimer=0;}
  if(!view.started){localBusy=false;renderLobby();return}
  if(m.type==='snapshot'){restoring=true;localBusy=false;if(!serverBusy){await restore(generation);if(generation!==connectionEpoch)return}else{reconnect.hidden=false;reconnect.textContent='Восстанавливаем партию…'}return}
  if(m.type==='begin'){
   localBusy=true;opening=true;restoring=false;lastNotice=null;lobbyVisible(false);intro.classList.add('is-leaving');setTimeout(()=>intro.hidden=true,360);await makeFrame();if(generation!==connectionEpoch)return;client.clearEmotes();await at(m.at);if(generation!==connectionEpoch)return;client.start(fakeDeck(view.hand),view.trump,view.attacker,{startAt:m.at});await idle();if(generation!==connectionEpoch)return;opening=false;localBusy=false;sync();return;
  }
  if(restoring||oldGame!==gameId){restoring=true;if(!serverBusy){await restore(generation);if(generation!==connectionEpoch)return}return}
  if(m.type==='play'){localBusy=true;sync();if(m.reshow){await at(m.at);if(generation!==connectionEpoch)return;client.cancelSign()}await at(m.move.startAt);if(generation!==connectionEpoch)return;client.play(m.move);await idle();if(generation!==connectionEpoch)return;if(m.reshow){client.signal(state.pending.seat,'take');await wait(1300);if(generation!==connectionEpoch)return}localBusy=false;sync();return}
  if(m.type==='signal'){localBusy=true;sync();await at(m.at);if(generation!==connectionEpoch)return;client.signal(m.actor,m.signal);await wait(m.signal==='ok'?2500:1400);if(generation!==connectionEpoch)return;localBusy=false;sync();return}
  if(m.type==='take'){localBusy=true;sync();await at(m.at);if(generation!==connectionEpoch)return;client.take(m.actor,m.actionId,m.at);await idle();if(generation!==connectionEpoch)return;localBusy=false;sync();return}
  if(m.type==='refill'){localBusy=true;sync();await idle();if(generation!==connectionEpoch)return;const order=m.attacker===room.seat?[...m.drawn,...Array(m.otherDrawn).fill('card-6-spades')]:[...Array(m.otherDrawn).fill('card-6-spades'),...m.drawn];frame.contentWindow.gameDeck.networkStock(order,view.stockCount);await at(m.at);if(generation!==connectionEpoch)return;client.refill(m.attacker,m.nextTurn,{startAt:m.at});await idle();if(generation!==connectionEpoch)return;localBusy=false;sync();return}
  if(m.type==='state'){localBusy=false;clearTimeout(requestTimer);if(!serverBusy){client.turn(view.attacker);if(m.notice&&m.notice!==lastNotice&&!view.result){lastNotice=m.notice;client.turnNotice(view.attacker)}}sync();updateClock()}
 }
 async function resnapshot(){restoring=true;localBusy=false;connected=false;sync();const old=ws;ws=null;old?.close();await connect()}
 async function connect(){clearTimeout(retryTimer);stopped=false;const generation=++connectionEpoch;queue=Promise.resolve();const{ticket}=await http('/api/rooms/'+room.code+'/ticket');if(generation!==connectionEpoch)return;const url=new URL(api+'/api/rooms/'+room.code+'/socket');url.protocol=url.protocol==='https:'?'wss:':'ws:';url.searchParams.set('ticket',ticket);const socket=new WebSocket(url);ws=socket;
  socket.onopen=()=>{if(socket!==ws)return;connected=true;retries=0;reconnect.hidden=true;socket.send(JSON.stringify({type:'ping',at:Date.now()}));sync()};
  socket.onmessage=e=>{if(socket!==ws)return;let m;try{m=JSON.parse(e.data)}catch{return}if(m.serverNow&&!offset)offset=m.serverNow-Date.now();if(['pong','emoji','error'].includes(m.type)){handle(m).catch(failure);return}queue=queue.then(()=>handle(m,generation)).catch(e=>{if(generation===connectionEpoch)failure(e)})};
  socket.onclose=e=>{if(socket!==ws)return;connected=false;sync();if(stopped)return;if(e.code===4001){stopped=true;notify('Игра открыта на другом устройстве');reconnect.hidden=false;reconnect.textContent='Игра открыта на другом устройстве';return}if(e.code===4004){renderLobby(true);return}reconnect.hidden=false;reconnect.textContent='Восстанавливаем соединение…';retryTimer=setTimeout(()=>connect().catch(failure),Math.min(8000,700*2**Math.min(retries++,4)))};socket.onerror=()=>{};
 }
 function failure(e){notify(e.message||'Соединение прервалось');if(view?.started){restoring=true;sync();reconnect.hidden=false;reconnect.textContent='Восстанавливаем партию…';retryTimer=setTimeout(()=>resnapshot().catch(failure),1500)}else{start.disabled=false;play.disabled=false;status.textContent=e.message||'Попробуйте ещё раз';if(room&&!stopped&&clock()<room.expiresAt){clearTimeout(retryTimer);retryTimer=setTimeout(()=>connect().catch(failure),2000)}}}
 function remember(){try{sessionStorage.setItem('redo-room',room.code)}catch{}}
 async function create(){fullscreen();if(ws){stopped=true;ws.close();ws=null}const data=await http('/api/rooms');room=data;remember();view=null;state=null;gameId=0;restoring=false;localBusy=false;connected=false;renderLobby();await connect()}
 play.onclick=()=>{play.disabled=true;create().catch(failure)};start.onclick=()=>{fullscreen();if(lobby.dataset.expired==='true')create().catch(failure);else if(send('ready')){start.disabled=true;start.textContent='Ждём второго игрока'}};
 copy.onclick=async()=>{try{await navigator.clipboard.writeText(link.value)}catch{const copied=window.redoInteractions.copy(()=>{link.focus();link.select();const ok=document.execCommand('copy');link.setSelectionRange(0,0);link.blur();return ok});if(!copied){notify('Не удалось скопировать. Нажми ещё раз');return}}notify('Ссылка скопирована')};
 setInterval(()=>{updateClock();if(room&&!view?.started&&!lobby.hidden){const left=Math.max(0,Math.ceil((room.expiresAt-clock())/1000));document.getElementById('room-expiry').textContent='Ссылка действует '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)renderLobby(true)}},100);
 setInterval(()=>{if(connected&&ws?.readyState===1)ws.send(JSON.stringify({type:'ping',at:Date.now()}))},20000);
 let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}viewport();if(room&&view?.started&&hiddenAt&&Date.now()-hiddenAt>500)resnapshot().catch(failure);else if(room&&!connected)connect().catch(failure);else if(connected)ws.send(JSON.stringify({type:'ping',at:Date.now()}));hiddenAt=0});
 (async()=>{play.disabled=true;if(!api||api.includes('YOUR_'))throw Error('Укажите адрес сервера Cloudflare в REDO_CONFIG.apiBase');if(!tg?.initData)throw Error('Открой Redo Cards через Telegram');const auth=await http('/api/session',{initData:tg.initData},false);token=auth.token;let saved='';try{saved=sessionStorage.getItem('redo-room')||''}catch{}const code=auth.startParam||new URLSearchParams(location.search).get('tgWebAppStartParam')||saved;if(code){if(!/^[A-Za-z0-9_-]{24}$/.test(code))throw Error('Неверное приглашение');room={...await http('/api/rooms/'+code+'/join')};remember();renderLobby();await connect()}else play.disabled=false})().catch(e=>{document.getElementById('intro-message').textContent=e.message;if(token){play.disabled=false;try{sessionStorage.removeItem('redo-room')}catch{}}notify(e.message)});
})();
